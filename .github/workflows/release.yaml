name: Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no tag created)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no tag created)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b4630c55afc332e0d8a732e0441849968e5cccaf # v8.0.0
        with:
          dry_run: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
